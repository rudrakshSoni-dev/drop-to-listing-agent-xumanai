services:
  - type: web
    name: drop2list-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: |
      mkdir -p bin
      if [ ! -f bin/ffmpeg ]; then
        curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ --strip-components=1 -C bin --wildcards '*/ffmpeg' 2>/dev/null || true
        chmod +x bin/ffmpeg 2>/dev/null || true
      fi
      pip install -r requirements.txt
    startCommand: PATH="$PWD/bin:$PATH" uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODELS
        value: openai/gpt-oss-120b,llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "*"
      - key: TRANSCRIBE_BACKEND
        value: groq
      - key: WHISPER_MODEL
        value: tiny.en
      - key: DEMO_DROPS_PER_IP
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
