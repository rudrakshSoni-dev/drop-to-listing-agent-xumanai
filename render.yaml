services:
  - type: web
    name: drop2list-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODELS
        value: openai/gpt-oss-120b,llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "*"
      - key: TRANSCRIBE_BACKEND
        value: whisper
      - key: DEMO_DROPS_PER_IP
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
